# =============================================================================
# DTrader 6 — Настройки скрипта скачивания исторических свечей (Gate.io Futures)
# scripts/historical-data/download_history.py
#
# Здесь только то, что пользователь может разумно захотеть поменять:
# какие символы, куда сохранять, глубину истории и вежливость к API
# Gate.io (частоту запросов). Технические факты о самом API Gate.io
# (лимит точек на запрос, недокументированный потолок в 10000 точек,
# URL эндпоинта, формат ответа) НАМЕРЕННО остаются константами в самом
# download_history.py, а не здесь — это не настройки проекта, а внешние
# ограничения биржи, которые опасно "исправлять" через конфиг, не
# перечитав объяснение в докстринге скрипта.
# =============================================================================

# symbols — список фьючерсных контрактов Gate.io для скачивания.
# Используется, если --symbol не передан явно в командной строке —
# явный --symbol в CLI имеет приоритет над этим списком (позволяет
# быстро скачать один символ для проверки, не трогая конфиг).
symbols:
  - BTC_USDT
  - ETH_USDT
  - SOL_USDT

# days — сколько суток истории скачивать назад от текущего момента.
# По умолчанию 7 — это примерно предел, который вообще отдаёт Gate.io
# для 1m-свечей (см. UNDOCUMENTED_MAX_POINTS_FROM_NOW в download_history.py).
# Скрипт предупредит на старте, если запросить больше, чем реально доступно.
days: 7

# out_dir — куда сохранять CSV-файлы с историей.
out_dir: ./history

# requests_per_second — сколько запросов в секунду отправлять к Gate.io
# API. Официальный лимит биржи — 300 запросов/сек/IP; здесь стоит
# консервативное значение с большим запасом, чтобы не нагружать чужой
# публичный API сильнее, чем реально нужно разовому скрипту.
requests_per_second: 10
