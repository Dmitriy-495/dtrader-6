# =============================================================================
# DTrader 6 — Signal-engine Service Configuration
# Signal-engine читает СЫРЫЕ индикаторы T/V/P из Redis (пишет их analyzer)
# и собирает их в единый торговый сигнал (LONG/SHORT/HOLD) для одного
# символа. Signal-engine НИКОГДА не ходит к Gate.io напрямую и не читает
# market:* напрямую — единственный источник данных для него — indicators:*
# в Redis, единственный секрет — REDIS_PASSWORD.
#
# ВАЖНО: секция rules ниже НАМЕРЕННО не содержит боевых порогов/весов.
# Точная методология сборки T+V+P в сигнал (документ TVP_SNIPER.md)
# физически отсутствует в доступных архивах на момент написания этого
# файла — см. PROMPT_NEXT.md в dtrader-tui-6. Пока методология не
# восстановлена с автором, rules/ работает как заглушка, которая явно
# возвращает HOLD и не совершает никаких скрытых предположений о
# порогах входа.
# =============================================================================

app:
  name: dtrader-6-signal-engine
  env: development         # development | production

# Торгуемые пары — должны совпадать с symbols в analyzer/config.yaml,
# иначе signal-engine будет опрашивать indicators:*, которые никто не пишет.
symbols:
  - BTC_USDT
  - ETH_USDT
  - SOL_USDT

redis:
  host: localhost
  port: 6379
  db: 0

# Таймфреймы, которые читает signal-engine — должны совпадать с тем,
# что публикует analyzer (timeframes.base + timeframes.aggregates
# в analyzer/config.yaml).
timeframes:
  - 1m
  - 8m
  - 24m

# Как часто опрашивать indicators:* в Redis. indicators:* — это String
# с TTL (не Stream), poll — единственный доступный способ чтения
# (см. ESTAFETA_SIGNAL.md, раздел "Шаг 3"). Разумно совпадает с
# calc_interval analyzer, чтобы не читать чаще, чем данные обновляются,
# и не отставать от них заметно.
poll_interval: 5s

# staleness_threshold — максимально допустимое отставание поля ts
# (unix ms внутри JSON) от текущего момента, после которого снапшот
# индикатора считается устаревшим и НЕ используется для решения — вместо
# него signal-engine публикует HOLD с явной причиной "stale data".
# Совпадает по духу с indicatorTTL в analyzer/internal/publisher (60s),
# но взято с запасом меньше TTL, чтобы заметить деградацию раньше,
# чем ключ протухнет и исчезнет из Redis совсем (см. ESTAFETA_SIGNAL.md,
# раздел 2 "Важный урок из деплоя").
staleness_threshold: 20s

# rules — параметры сборки T+V+P в сигнал. ПУСТО НАМЕРЕННО.
# TODO(TVP_SNIPER.md): как только методология будет восстановлена с
# автором (роли таймфреймов HTF/MTF/LTF, веса компонентов, пороги
# входа/выхода, диапазоны RSI типа "26%-74% — запрет торговли",
# тактики агрессивная/нормальная/консервативная) — заполнить эту
# секцию и реализовать internal/rules соответствующим образом.
# Пока секция пуста, internal/rules обязан возвращать HOLD для любого
# входа, а не подставлять правдоподобные, но не согласованные цифры.
rules: {}
